host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for StreamShort, a short-form video streaming platform.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: StreamShort API
  version: "1.0"
paths:
  /content/series:
    get:
      consumes:
      - application/json
      description: Get a list of series with optional filtering
      parameters:
      - description: Language filter
        in: query
        name: language
        type: string
      - description: Category filter
        in: query
        name: category
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SeriesListResponse'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List series
      tags:
      - content
    post:
      consumes:
      - application/json
      description: Create a new series entry. Requires creator privileges.
      parameters:
      - description: Series creation request
        in: body
        name: series
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateSeriesRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Series'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Create a new series
      tags:
      - content
  /content/series/{id}:
    get:
      consumes:
      - application/json
      description: Get detailed information about a series
      parameters:
      - description: Series ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SeriesDetailResponse'
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get series details
      tags:
      - content
  /content/series/search:
    get:
      consumes:
      - application/json
      description: Search for series by title or synopsis
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Results per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SeriesListResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Search series
      tags:
      - content
swagger: "2.0"
