host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for StreamShort, a short-form video streaming platform.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: StreamShort API
  version: "1.0"
paths:
  /api/admin/content/approve:
    post:
      consumes:
      - application/json
      description: Approve or reject pending content.
      parameters:
      - description: Approval Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ApproveContentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ApproveContentResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Approve Content
      tags:
      - admin
  /api/admin/creators:
    get:
      description: List all creators.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.CreatorProfile'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List Creators
      tags:
      - admin
  /api/admin/creators/{id}:
    delete:
      description: Delete a creator profile.
      parameters:
      - description: Creator ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Delete Creator Profile
      tags:
      - admin
  /api/admin/dashboard/stats:
    get:
      description: Get overview statistics for admin dashboard.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get Dashboard Stats
      tags:
      - admin
  /api/admin/earnings:
    get:
      description: List earnings with optional filters.
      parameters:
      - description: Creator ID
        in: query
        name: creator_id
        type: string
      - description: Status
        in: query
        name: status
        type: string
      - description: Earnings Type
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List Creator Earnings
      tags:
      - admin
  /api/admin/episodes/{id}:
    delete:
      description: Delete an episode.
      parameters:
      - description: Episode ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
